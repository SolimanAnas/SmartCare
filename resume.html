<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Baseline CSP (GitHub Pages can't send headers). 'unsafe-inline' stays until
     this page's inline scripts/handlers move to .js files. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://fonts.googleapis.com https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>SmartCare · Resume</title>
</head>
<body>
<script>
  // Target of the manifest.json "Resume last chapter" shortcut — reads the
  // same smartcare_last_visited list app.js's recordLastVisited() writes
  // (most recent first) and jumps straight there, skipping the home screen.
  (function () {
    var url = 'index.html';
    try {
      var list = JSON.parse(localStorage.getItem('smartcare_last_visited') || '[]');
      if (list.length && list[0] && list[0].url) url = list[0].url;
    } catch (e) {}
    location.replace(url);
  })();
</script>
</body>
</html>
